/* =========================================================
   NAVIGATION
   ========================================================= */

function isDayUnlocked(day){

  if(day === 1) return true;

  if(completedDays.includes(day-1)){

    const unlock = Number(
      localStorage.getItem("vismayaUnlockTime_" + (day))
      || 0
    );

    if(Date.now() >= unlock){
      return true;
    }
  }

  return completedDays.includes(day);
}


function renderDays(){

  const nav = document.getElementById("daysNav");
  nav.innerHTML="";

  for(let i=1;i<=15;i++){

    const button=document.createElement("button");
    button.className="day-btn";

    if(i===currentDay){
      button.classList.add("active");
    }

    if(!isDayUnlocked(i)){
      button.classList.add("locked");
      button.innerHTML="🔒 Day "+i;
    }else{
      button.innerHTML=
        completedDays.includes(i)
        ? "✅ Day "+i
        : "Day "+i;
    }

    button.onclick=()=>{

      if(isDayUnlocked(i)){
        currentDay=i;
        localStorage.setItem("vismayaCurrentDay",currentDay);
        render();
      }else{
        alert("🔒 This day is still locked!\n\nFinish the previous day and wait for the 12-hour countdown. 💗");
      }

    };

    nav.appendChild(button);
  }
}


/* =========================================================

function renderQuestion(q,index){

  let html="";

  html+=`<div class="question ${q.type==="task"?"task-box":""}">`;

  html+=`<h3>${index+1}. ${q.q}</h3>`;

  if(q.type==="mcq"){

    q.options.forEach((option,i)=>{

      html+=`
      <label class="option">
        <input type="radio"
          name="q${index}"
          value="${escapeHTML(option)}">
        ${escapeHTML(option)}
      </label>
      `;

    });

  }

  if(q.type==="text"){

    html+=`
      <textarea
        id="text${index}"
        placeholder="Write your answer here... 💗"></textarea>
    `;

  }

  if(q.type==="task"){

    html+=`
      <label class="task-check">
        <input type="checkbox" id="task${index}">
        I completed today's task ✅
      </label>
    `;

    html+=`
      <p class="small">
        ${escapeHTML(q.task)}
      </p>
    `;
  }

  html+=`</div>`;

  return html;
}

  if(completedDays.includes(currentDay)){

    showCompletedDay();
    return;
  }

  if(!isDayUnlocked(currentDay)){

    showLockedDay();
    return;
  }

  const day=DAYS[currentDay-1];

  let html=`

    <h2 class="day-title">${day.title}</h2>

    <div class="day-subtitle">
      4 questions + 1 task • 5 marks
    </div>

  `;

  day.questions.forEach((q,i)=>{
    html+=renderQuestion(q,i);
  });

  html+=`
    <button class="submit-btn" onclick="submitDay()">
      💗 SUBMIT DAY ${currentDay}
    </button>

    <div id="result" class="result"></div>
  `;

  content.innerHTML=html;
}


/* =========================================================
   SUBMIT DAY
   ========================================================= */

function submitDay(){

  if(submittedThisSession) return;

  const day=DAYS[currentDay-1];

  let score=0;

  let reviews=[];

  day.questions.forEach((q,index)=>{

    let correct=false;
    let userAnswer="";

    if(q.type==="mcq"){

      const selected=document.querySelector(
        `input[name="q${index}"]:checked`
      );

      if(selected){
        userAnswer=selected.value;
        correct=userAnswer===q.answer;
      }

    }

    else if(q.type==="text"){

      const box=document.getElementById("text"+index);

      userAnswer=box.value.trim();

      if(q.flexible){

        correct=userAnswer.length>=3;

      }else{

        const lower=userAnswer.toLowerCase();

        correct=q.keywords.some(keyword =>
          lower.includes(keyword.toLowerCase())
        );

      }

    }

    else if(q.type==="task"){

      const checkbox=document.getElementById("task"+index);

      correct=checkbox.checked;

      userAnswer=correct
        ? "Task completed"
        : "Task not completed";

    }

    if(correct) score++;

    reviews.push({
      question:q,
      userAnswer:userAnswer,
      correct:correct
    });

  });


  totalScore += score;

  localStorage.setItem(
    "vismayaTotalScore",
    totalScore
  );


  if(!completedDays.includes(currentDay)){
    completedDays.push(currentDay);

    localStorage.setItem(
      "vismayaCompletedDays",
      JSON.stringify(completedDays)
    );
  }


  /* Start 12-hour countdown for next day */

  if(currentDay < 15){

    const nextDay=currentDay+1;

    const nextUnlock=
      Date.now()+(12*60*60*1000);

    localStorage.setItem(
      "vismayaUnlockTime_"+nextDay,
      nextUnlock
    );

  }


  submittedThisSession=true;

  showResult(score,reviews);

  updateScore();

  renderDays();

}


/* =========================================================
   SHOW RESULT
   ========================================================= */

function showResult(score,reviews){

  const result=document.getElementById("result");

  result.style.display="block";

  let html=`

    <div>💗 DAY ${currentDay} RESULT 💗</div>

    <div class="result-score">
      ${score} / 5
    </div>

    <p>
      ${scoreMessages[score]}
    </p>

    <div class="answer-review">
      <h3>📖 Answer Review</h3>
  `;


  reviews.forEach((r,i)=>{

    let answerText="";

    if(r.question.type==="mcq"){

      answerText=
        "Correct answer: <b>"+
        escapeHTML(r.question.answer)+
        "</b>";

    }

    else if(r.question.type==="text"){

      if(r.question.flexible){

        answerText=
          "<b>No single fixed answer!</b><br>"+
          "Your answer was accepted because you completed the question. 💗";

      }else{

        answerText=
          "<b>Expected idea:</b> "+
          escapeHTML(r.question.keywords.join(", "));

      }

    }

    else{

      answerText=
        "<b>Task:</b> "+
        escapeHTML(r.question.task);

    }


    html+=`

      <div class="review ${r.correct?"correct":"wrong"}">

        <b>
          ${r.correct?"✅ CORRECT":"❌ WRONG"}
        </b>

        <br><br>

        Your answer:
        ${r.userAnswer
          ? escapeHTML(r.userAnswer)
          : "<i>No answer</i>"}

        <br><br>

        ${answerText}

      </div>

    `;

  });


  html+=`</div>`;


  if(currentDay<15){

    html+=`

      <div class="timer-box">

        ⏰ <b>Next day unlocks after 12 hours</b>

        <div class="timer" id="countdown">
          Calculating...
        </div>

        <button class="next-btn" onclick="goNextDay()">
          🔒 Wait for Day ${currentDay+1}
        </button>

      </div>

    `;

  }else{

    html+=`

      <div class="timer-box">

        🏆 YOU FINISHED ALL 15 DAYS! 🏆

        <div class="result-score">
          ${totalScore} / 75
        </div>

        <p>
          ${finalMessage(totalScore)}
        </p>

      </div>

    `;

  }


  result.innerHTML=html;

  result.scrollIntoView({
    behavior:"smooth"
  });

  startCountdown();

}


/* =========================================================
   LOCKED DAY SCREEN
   ========================================================= */

function showLockedDay(){

  const content=document.getElementById("content");

  content.innerHTML=`

    <div class="result" style="display:block">

      <div style="font-size:50px">🔒</div>

      <h2>
        Day ${currentDay} is still sleeping 😴
      </h2>

      <p>
        Finish the previous day's challenge first.
      </p>

      <div class="timer-box">

        ⏰ Your next challenge unlocks in:

        <div class="timer" id="countdown">
          Calculating...
        </div>

      </div>

    </div>

  `;

  startCountdown();

}


/* =========================================================
   COMPLETED DAY
   ========================================================= */

function showCompletedDay(){

  const content=document.getElementById("content");

  content.innerHTML=`

    <div class="result" style="display:block">

      <div style="font-size:50px">✅</div>

      <h2>Day ${currentDay} completed!</h2>

      <p>
        You already conquered this challenge. 😂💗
      </p>

      ${
        currentDay<15
        ?`
          <div class="timer-box">
            ⏰ Next challenge unlocks in:
            <div class="timer" id="countdown">
              Calculating...
            </div>
          </div>
        `
        :`
          <div class="timer-box">
            🏆 FINAL SCORE
            <div class="result-score">
              ${totalScore} / 75
            </div>
            <p>${finalMessage(totalScore)}</p>
          </div>
        `
      }

    </div>

  `;

  startCountdown();

}


/* =========================================================
   COUNTDOWN
   ========================================================= */

function startCountdown(){

  clearInterval(window.countdownInterval);

  if(currentDay>=15) return;

  const unlock=Number(
    localStorage.getItem(
      "vismayaUnlockTime_"+(currentDay+1)
    ) || 0
  );

  if(!unlock) return;

  function update(){

    const element=document.getElementById("countdown");

    if(!element){
      clearInterval(window.countdownInterval);
      return;
    }

    const remaining=unlock-Date.now();

    if(remaining<=0){

      element.innerHTML="🎉 UNLOCKED!";

      clearInterval(window.countdownInterval);

      setTimeout(()=>{
        render();
      },800);

      return;
    }

    const hours=Math.floor(
      remaining/(1000*60*60)
    );

    const minutes=Math.floor(
      (remaining%(1000*60*60))/
      (1000*60)
    );

    const seconds=Math.floor(
      (remaining%(1000*60))/
      1000
    );

    element.innerHTML=
      `${String(hours).padStart(2,"0")}:`+
      `${String(minutes).padStart(2,"0")}:`+
      `${String(seconds).padStart(2,"0")}`;

  }

  update();

  window.countdownInterval=
    setInterval(update,1000);
}


/* =========================================================
   NEXT DAY
   ========================================================= */

function goNextDay(){

  if(currentDay>=15) return;

  if(isDayUnlocked(currentDay+1)){

    currentDay++;

    localStorage.setItem(
      "vismayaCurrentDay",
      currentDay
    );

    submittedThisSession=false;

    render();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }else{

    alert(
      "Not yet! 😭\n\n"+
      "The next challenge needs another few hours of friendship patience. 😂💗"
    );

  }

}


/* =========================================================
   SCORE DISPLAY
   ========================================================= */

function updateScore(){

  document.getElementById("totalScore").innerHTML=
    `${totalScore} / 75`;

  document.getElementById("progressBar").style.width=
    `${(totalScore/75)*100}%`;

  if(totalScore===0){

    document.getElementById("scoreMessage").innerHTML=
      "Your boredom-breaking journey starts now 💗";

  }else if(totalScore<20){

    document.getElementById("scoreMessage").innerHTML=
      "The friendship studies department is concerned. 😂";

  }else if(totalScore<40){

    document.getElementById("scoreMessage").innerHTML=
      "Okayyy... progress is happening! 💗";

  }else if(totalScore<60){

    document.getElementById("scoreMessage").innerHTML=
      "Vismaya is becoming dangerous at relationship studies. 👀";

  }else if(totalScore<75){

    document.getElementById("scoreMessage").innerHTML=
      "TOPPER ALERT 🚨💗";

  }else{

    document.getElementById("scoreMessage").innerHTML=
      "75/75! The ultimate friendship-studies champion! 🏆";

  }

}


/* =========================================================
   FINAL SCORE MESSAGE
   ========================================================= */

function finalMessage(score){

  if(score<=15)
    return "Vismaya... we need to have a serious meeting. 😂💀";

  if(score<=30)
    return "You survived, but barely. Relationship Studies needs revision! 😂";

  if(score<=45)
    return "Not bad! The friendship brain is functioning. 😌💗";

  if(score<=60)
    return "Okay topper! Somebody studied the friendship syllabus! 🔥";

  if(score<=70)
    return "EXCELLENT! The friendship department is impressed! 🏆💗";

  return "75/75?! ABSOLUTE LEGEND. Somebody give this girl a degree in Relationship Studies! 🏆😂💗";

}


/* =========================================================
   SECURITY / HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

function render(){

  updateScore();

  renderDays();

  renderDay();

}


/* =========================================================
   START APP
   ========================================================= */

render();

</script>
