function formatTime(ms){

 let total=Math.max(0,Math.floor(ms/1000));

 let h=Math.floor(total/3600);
 let m=Math.floor((total%3600)/60);
 let s=total%60;

 return String(h).padStart(2,"0")+":"+
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");

}

function reaction(score){

function renderNav(){

 nav.innerHTML="";

 DAYS.forEach((day,i)=>{

  const b=document.createElement("button");

  b.textContent="Day "+(i+1);

  if(i===data.currentDay)b.classList.add("active");

  if(!data.unlocked[i])b.classList.add("locked");

  b.onclick=()=>{

   if(data.unlocked[i]){

    showDay(i);

   }else{

    alert("🔒 This day is still locked!\n\nYou need to wait until the 12-hour timer finishes. 💗");

   }

  };

  nav.appendChild(b);

 });

}

function renderDays(){

 DAYS.forEach((day,dayIndex)=>{

  const section=document.createElement("section");

  section.className="day";

  section.id="day-"+dayIndex;

  const card=document.createElement("div");

  card.className="daycard";

  card.innerHTML=`

  <div class="daytitle">

   <h2>DAY ${dayIndex+1}</h2>

   <div class="daytheme">${day.theme}</div>

  </div>

  <p class="small">Question ${dayIndex+1} of 15 • 5 questions • 1 mark each</p>

  <div id="questions-${dayIndex}"></div>

  <button class="submit" id="submit-${dayIndex}">
   💗 ENTER & CHECK MY ANSWERS
  </button>

  <div class="result" id="result-${dayIndex}"></div>

  `;

  section.appendChild(card);

  container.appendChild(section);

  const qbox=card.querySelector("#questions-"+dayIndex);

  day.questions.forEach((q,qIndex)=>{

   const div=document.createElement("div");

   div.className="question";

   let options="";

   q.o.forEach((option,optIndex)=>{

    options+=`

    <label class="option">

     <input type="radio"
      name="day${dayIndex}q${qIndex}"
      value="${optIndex}">

     ${String.fromCharCode(65+optIndex)}) ${option}

    </label>

    `;

   });

   div.innerHTML=`

   <div class="question-number">
    QUESTION ${qIndex+1} • 1 MARK
   </div>

   <h3>${q.q}</h3>

   ${options}

   `;

   qbox.appendChild(div);

  });

  card.querySelector("#submit-"+dayIndex).onclick=()=>submitDay(dayIndex);

 });

}

function submitDay(dayIndex){

 if(data.scores[dayIndex]!==null){

  showDay(dayIndex);

  return;

 }

 const day=DAYS[dayIndex];

 let selected=[];

 for(let q=0;q<5;q++){

  const checked=document.querySelector(
   `input[name="day${dayIndex}q${q}"]:checked`
  );

  if(!checked){

   alert("💗 Waittt! You haven't answered Question "+(q+1)+" yet!");

   return;

  }

  selected.push(Number(checked.value));

 }

 let score=0;

 selected.forEach((answer,i)=>{

  if(answer===day.questions[i].a)score++;

 });

 data.answers[dayIndex]=selected;

 data.scores[dayIndex]=score;

 data.total= data.scores.reduce(
  (sum,x)=>sum+(x===null?0:x),0
 );

 if(dayIndex<14){

  data.unlockTimes[dayIndex+1]=Date.now()+12*60*60*1000;

 }

 save();

 showResult(dayIndex);

 updateHeader();

 renderNav();

}

  <div class="dialogue">${reaction(score)}</div>

 </div>

 <div class="review">

 <h3>🔎 Let's see what happened...</h3>

 `;

 day.questions.forEach((q,i)=>{

  const user=data.answers[dayIndex][i];

  const ok=user===q.a;

  html+=`

  <div class="review-item ${ok?"correct":"wrong"}">

   <b>${ok?"✅ CORRECT!":"❌ WRONG!"}</b>

   <div>${q.q}</div>

   <div style="margin-top:7px">
   Your answer:
   <strong>${q.o[user]}</strong>
   </div>

   <div style="margin-top:4px">
   Correct answer:
   <strong>${q.o[q.a]}</strong>
   </div>

  </div>

  `;

 });

 html+=`</div>`;

 if(dayIndex<14){

  html+=`

  <div class="nextbox">

   <div style="font-size:30px">🔒💗</div>

   <h3>DAY ${dayIndex+2} IS LOCKED</h3>

   <p>
   You completed today's challenge!
   </p>

   <p>
   Come back after <strong>12 hours</strong>
   to unlock the next day.
   </p>

   <div class="timer" id="timer-${dayIndex}">
   12:00:00
   </div>

  </div>

  `;

 }else{

  html+=`

  <div class="nextbox">

   <div style="font-size:35px">👑</div>

   <h3>YOU COMPLETED ALL 15 DAYS!</h3>

   <button class="nextbtn" onclick="showFinal()">
   🏆 SEE MY FINAL SCORE
   </button>

  </div>

  `;

 }

 result.innerHTML=html;

 result.classList.add("show");

 document.getElementById("submit-"+dayIndex).disabled=true;

 updateTimer(dayIndex);

}

function updateTimer(dayIndex){

 if(dayIndex>=14)return;

 const target=data.unlockTimes[dayIndex+1];

 const timer=document.getElementById("timer-"+dayIndex);

 if(!timer)return;

 function tick(){

  const remaining=target-Date.now();

  if(remaining<=0){

   data.unlocked[dayIndex+1]=true;
   data.currentDay=dayIndex+1;

   save();

   timer.innerHTML="🎉 UNLOCKED!";

   renderNav();

   updateHeader();

   return;

  }

  timer.textContent=formatTime(remaining);

  setTimeout(tick,1000);

 }

 tick();

}

function showDay(index){

 data.currentDay=index;

 save();

 document.querySelectorAll(".day").forEach(d=>{
  d.classList.remove("active");
 });

 const selected=document.getElementById("day-"+index);

 if(selected)selected.classList.add("active");

 renderNav();

 updateHeader();

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

 if(data.scores[index]!==null){

  showResult(index);

 }else{

  const result=document.getElementById("result-"+index);

  if(result)result.classList.remove("show");

 }

}

function updateHeader(){

 document.getElementById("dayText").textContent=
 "Day "+(data.currentDay+1)+" of 15";

 document.getElementById("totalText").textContent=
 "Total: "+data.total+" / 75";

 document.getElementById("progress").style.width=
 ((data.total/75)*100)+"%";

}

function showFinal(){

 document.getElementById("days").style.display="none";

 document.getElementById("daynav").style.display="none";

 document.getElementById("final").classList.add("show");

 document.getElementById("finalScore").textContent=
 data.total+" / 75";

 let message="";

 if(data.total<=15){

  message="😭 VISMAYA!!! We need to have a serious meeting about these brain cells. 😂💗";

 }else if(data.total<=30){

  message="😂 Okay... you survived, but your brain definitely took several holidays.";

 }else if(data.total<=45){

  message="😌 Not bad! The friendship knowledge is slowly loading...";

 }else if(data.total<=60){

  message="👑 OHHH! Someone has been paying attention to the gang! Very impressive!";

 }else if(data.total<=74){

  message="🔥 ALMOST PERFECT! The Friendship Department is extremely proud of you!";

 }else{

  message="🏆💗 PERFECT 75/75!!! VISMAYA HAS OFFICIALLY MASTERED THE GANG LORE!!! 👑😂";

 }

 document.getElementById("finalDialogue").innerHTML=
 `<div class="dialogue">${message}</div>`;

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}

function start(){

 renderDays();

 renderNav();

 updateHeader();

 let index=data.currentDay;

 if(!data.unlocked[index]){

  index=0;

  data.currentDay=0;

 }

 showDay(index);

 DAYS.forEach((_,i)=>{

  if(data.scores[i]!==null){

   setTimeout(()=>{

    if(document.getElementById("result-"+i)){

     showResult(i);

    }

   },100);

  }

 });

}

start();

</script>

</body>
</html>
