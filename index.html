/* =========================

========================= */

function renderNav(){

  const nav=document.getElementById("dayNav");

  nav.innerHTML="";

  for(let i=0;i<days.length;i++){

    const button=document.createElement("button");

    button.textContent=
      saved.completed.includes(i)
      ? "✓ Day "+(i+1)
      : "Day "+(i+1);

    if(i>0 && !saved.completed.includes(i-1)){
      button.classList.add("locked");
    }

    button.onclick=()=>showDay(i);

    nav.appendChild(button);
  }
}


/* =========================
   SHOW DAY
========================= */

function showDay(index){

  const app=document.getElementById("app");

  const previousDone=
    index===0 || saved.completed.includes(index-1);

  const alreadyDone=
    saved.completed.includes(index);

  if(!previousDone){

    app.innerHTML=`

      <div class="card lockScreen">

        <div class="lockEmoji">🔒</div>

        <h2>Day ${index+1} is locked!</h2>

        <p>
        Finish Day ${index} first to unlock this one. 💗
        </p>

        <p class="small">
        One day at a time, madam. 😂
        </p>

      </div>

    `;

    return;
  }


  const day=days[index];

  let html=`

    <div class="card">

      <div class="dayTitle">

        <div class="dayNumber">
          DAY ${index+1}
        </div>

        <div class="dayTheme">
          ${day.theme}
        </div>

      </div>

      <p class="small">
        Answer all 5 questions first.
        Your answers will be revealed only after you submit. 👀
      </p>

  `;


  day.questions.forEach((q,qIndex)=>{

    html+=`

      <div class="question">

        <div class="questionNo">
          QUESTION ${qIndex+1} / 5
        </div>

        <h3>${q.q}</h3>

    `;


    if(q.type==="text"){

      html+=`

        <input
          class="textInput"
          id="answer_${index}_${qIndex}"
          placeholder="Type your answer here..."
        >

      `;

    }else{

      q.options.forEach(option=>{

        html+=`

          <label class="option">

            <input
              type="radio"
              name="q_${index}_${qIndex}"
              value="${option}"
            >

            ${option}

          </label>

        `;

      });

    }

    html+=`</div>`;

  });


  if(!alreadyDone){

    html+=`

      <button
        class="submitBtn"
        onclick="submitDay(${index})">

        💗 SUBMIT MY ANSWERS 💗

      </button>

    `;

  }

  html+=`</div>`;


  if(alreadyDone){

    html+=renderPreviousResult(index);

  }

  app.innerHTML=html;

  updateHeader(index);

}
