/* CREATE DAYS */

const nav=document.getElementById("nav");
const daysContainer=document.getElementById("days");

missions.forEach((day,index)=>{

 const dayNumber=index+1;

 const navButton=document.createElement("button");
 navButton.textContent="Day "+dayNumber;

 navButton.onclick=()=>{
   document.getElementById("day"+dayNumber)
   .scrollIntoView({behavior:"smooth"});
 };

 nav.appendChild(navButton);

 const article=document.createElement("article");
 article.className="day";
 article.id="day"+dayNumber;

 article.innerHTML=`
 <div class="dayhead">
   <b>DAY ${dayNumber}</b>
   <span>${day.title}</span>
 </div>
 `;

 day.items.forEach((item,itemIndex)=>{

   const activity=document.createElement("section");
   activity.className="activity";

   const id=`day${dayNumber}_mission${itemIndex+1}`;

   activity.innerHTML=`
     <div class="tag">${item[0]}</div>

     <h3>${item[1]}</h3>

     <div class="answer">
       <input
         type="text"
         id="${id}"
         placeholder="Type your answer here..."
       >
     </div>

     <button onclick="toggleReveal(this)">
       👀 Reveal
     </button>

     <div class="reveal">
       ${item[2]}
     </div>
   `;

   article.appendChild(activity);

 });

 daysContainer.appendChild(article);

});


/* REVEAL BUTTON */

function toggleReveal(button){
 const reveal=button.nextElementSibling;
 reveal.classList.toggle("show");

 if(reveal.classList.contains("show")){
   button.textContent="🙈 Hide";
 }else{
   button.textContent="👀 Reveal";
 }
}


/* SAVE ANSWERS */

function saveAnswers(){

 const answers={};

 document.querySelectorAll("input").forEach(input=>{
   answers[input.id]=input.value;
 });

 localStorage.setItem(
   "vismayaBoredomAnswers",
   JSON.stringify(answers)
 );

 alert("💗 Your answers are safely saved on this phone!");
}


/* LOAD SAVED ANSWERS */

window.addEventListener("load",()=>{

 const saved=localStorage.getItem("vismayaBoredomAnswers");

 if(!saved)return;

 try{

   const answers=JSON.parse(saved);

   Object.keys(answers).forEach(id=>{

     const input=document.getElementById(id);

     if(input){
       input.value=answers[id];
     }

   });

 }catch(e){}

});


/* CLEAR ANSWERS */

function clearAnswers(){

 const confirmClear=
 confirm("Are you sure you want to clear all your saved answers?");

 if(!confirmClear)return;

 localStorage.removeItem("vismayaBoredomAnswers");

 document.querySelectorAll("input").forEach(input=>{
   input.value="";
 });

 alert("Answers cleared 💗");
}
